spring:
  application:
    name: openex-core
  datasource:
    url: jdbc:postgresql://localhost:5432/openex
    username: openex
    password: openex
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  jwt:
    secret: "openex-dev-secret-key-change-in-production-min-32-chars-long-1234567890"
    expiration-ms: 86400000