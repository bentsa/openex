spring:
  application:
    name: openex-core
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/openex}
    username: ${DATABASE_USERNAME:openex}
    password: ${DATABASE_PASSWORD:openex}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:openex-dev-secret-key-change-in-production-min-32-chars-long-1234567890}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}